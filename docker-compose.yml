services:
  vkomari:
    image: ghcr.io/kadidalax/vkomari:latest
    container_name: vkomari
    ports:
      - "${PORT:-25770}:8000"
    volumes:
      - vkomari_data:/app/data
    environment:
      - JWT_SECRET=${JWT_SECRET:-vkomari-secret-key-2026}
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - http_proxy=${http_proxy:-}
      - https_proxy=${https_proxy:-}
      - VKOMARI_KOMARI_MAX_RPS=${VKOMARI_KOMARI_MAX_RPS:-50}
    restart: unless-stopped

volumes:
  vkomari_data:
